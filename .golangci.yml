version: "2"
linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec
    - ineffassign
    - unused
    - misspell
  settings:
    errcheck:
      exclude-functions:
        - (*github.com/zamber/huemux/internal/server.Conn).WriteMessage
        - (*os.File).Close
        - (*os.File).Write
        - (*net.UDPConn).Close
        - (*net.TCPConn).Close
        - (*net.Conn).Close
        - (net.Conn).Close
        - (*os.File).Remove
      exclude:
        # Common patterns where errors are intentionally ignored with defer.
        - path: '(.+)\.Body\.Close'
          msg: 'Error return value of `resp.Body.Close` is not checked'
        - path: '.+_test\.go'
          msg: 'Error return value of `.*\.Close` is not checked'
    gosec:
      excludes:
        # G402 — TLS InsecureSkipVerify: bridge certs are self-signed by design.
        - G402
        # G505 — crypto/sha1: required by RFC 6455 §5.2 for WebSocket handshake.
        - G505
        # G204 — Subprocess launched with variable: xdg-open/open/rundll32 are
        # called with URLs from trusted sources (the server's own printed URL).
        - G204
        # G306 — WriteFile permissions 0644: intentional for certs and other
        # files that must be readable by the process.
        - G306
        # G301 — MkdirAll permissions 0755: intentional for shared directories.
        - G301
        # G101 — Hardcoded credentials: test files use fake tokens.
        - G101
        # G304 — File inclusion via variable: all paths come from config
        # directories the process itself created, not from user input.
        - G304
        # G104 — Errors unhandled: the store.go tmp.Close() pattern is
        # intentional (best-effort cleanup in error paths).
        - G104
        # G114 — http.Serve without timeouts: loopback-only server, no
        # untrusted network exposure.
        - G114
        # G115 — integer overflow conversions: all are explicit and bounded
        # (encoding, color math, packet lengths).
        - G115
        # G117 — Marshaled field matches secret pattern: clientkey is the
        # bridge-issued hex credential, stored locally on disk.
        - G117
        # G123 — VerifyPeerCertificate with session resumption: only used with
        # our custom VerifyPeerCertificate that checks pin; resumed sessions
        # re-verify.
        - G123
        # G703 — Path traversal via taint analysis: dir comes from os.UserConfigDir,
        # not user input.
        - G703
        # G706 — Log injection via taint analysis: logged values come from
        # OS environment variables (platform, session type), not user input.
        - G706
    staticcheck:
      checks:
        - "all"
        # SA1019 — dtls.Config/dtls.Client deprecated: the pion/dtls library
        # deprecated its config-struct API in favor of options; migration needs
        # a coordinated upstream update.
        - "-SA1019"
        # ST1000 — package comment: pipeline covered; sub-packages in other dirs
        # are internal and self-documenting.
        - "-ST1000"
        # QF1002 — could use tagged switch: these switches on computed values
        # are often clearer as-is; mechanical rewrites reduce readability.
        - "-QF1002"
        # S1011 — replace loop with append: the explicit loop documents the
        # intent more clearly in some cases (e.g. IP address accumulation).
        - "-S1011"
formatters:
  enable:
    - gofmt
