<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#000000" id="theme-color-meta">
<title>HueMux — Lights</title>
<script>
(function() {
  var DARK = '#000000', LIGHT = '#f7f3ea';
  var t = localStorage.getItem('theme');
  var resolved;
  // Must understand the simple-* variants too, or a page stored as
  // "simple-dark" would flash the system theme before theme.js corrects it.
  // Keep in sync with BASE/CHOICES in shared/theme.js.
  var base = { light: 'light', dark: 'dark', 'simple-light': 'light', 'simple-dark': 'dark' }[t];
  if (base) {
    document.documentElement.setAttribute('data-theme', base);
    if (t.indexOf('simple-') === 0) document.documentElement.setAttribute('data-simple', '');
    resolved = base;
  } else {
    resolved = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  var meta = document.getElementById('theme-color-meta');
  if (meta) meta.setAttribute('content', resolved === 'light' ? LIGHT : DARK);
})();
</script>
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/shared/header.css">
<link rel="stylesheet" href="/shared/pairing.css">
<link rel="stylesheet" href="/lights.css">
</head>
<body>
<huemux-header active="lights"></huemux-header>

<huemux-pairing id="unpaired-panel" hidden></huemux-pairing>

<div id="app" hidden>
  <div class="lights-toolbar">
    <details id="filter-details" class="filter-menu">
      <summary>
        <span id="filter-summary">Categories</span>
      </summary>
      <div id="filter-list" class="filter-list"></div>
    </details>
    <button type="button" id="stop-streaming-btn" class="stop-streaming-btn" hidden data-i18n="lights.stopStreaming">Stop streaming</button>
    <span id="conn-dot" class="dot" title="connection to HueMux"></span>
  </div>

  <section id="scenes-section" class="scenes-section" hidden>
    <h2 data-i18n="lights.entertainmentScenes">Entertainment area scenes</h2>
    <div id="scenes-strip" class="scenes-strip"></div>
  </section>

  <main id="lights-grid" class="lights-grid"></main>
</div>

<script src="/shared/theme.js"></script>
<script src="/shared/i18n.js"></script>
<script src="/shared/features.js"></script>
<script src="/shared/header.js"></script>
<script src="/shared/pairing.js"></script>
<script src="/shared/color.js"></script>
<script src="/lights.js"></script>
</body>
</html>
