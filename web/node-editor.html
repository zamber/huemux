<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#000000" id="theme-color-meta">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>HueMux — Presets</title>
<script src="/shared/standalone-redirect.js"></script>
<script>
(function() {
  var DARK = '#000000', LIGHT = '#f7f3ea';
  var t = localStorage.getItem('theme');
  var resolved;
  var base = { light: 'light', dark: 'dark', 'simple-light': 'light', 'simple-dark': 'dark' }[t];
  if (base) {
    document.documentElement.setAttribute('data-theme', base);
    resolved = base;
  } else {
    resolved = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  if (localStorage.getItem('themeSimple') === '1' || (t && t.indexOf('simple-') === 0)) {
    document.documentElement.setAttribute('data-simple', '');
  }
  var meta = document.getElementById('theme-color-meta');
  if (meta) meta.setAttribute('content', resolved === 'light' ? LIGHT : DARK);
})();
</script>
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/shared/header.css">
<link rel="stylesheet" href="/shared/scrollbars.css">
<link rel="stylesheet" href="/shared/pairing.css">
<style>
  body { margin: 0; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: calc(100vh - 48px); }

  /* ── Toolbar ─────────────────────────────────────────────────── */
  #toolbar {
    display: flex; gap: 6px; padding: 6px 10px;
    border-bottom: 2px solid var(--border); align-items: center;
    flex-shrink: 0; flex-wrap: wrap;
  }
  #toolbar select, #toolbar button, #toolbar a {
    font-family: inherit; font-size: 13px;
    background: var(--surface); color: var(--ink); border: 2px solid var(--border);
    border-radius: 4px; padding: 3px 8px; cursor: pointer; text-decoration: none;
    white-space: nowrap;
  }
  #toolbar button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  #toolbar button:disabled { opacity: 0.4; cursor: default; }
  #toolbar .sep { flex: 1; }
  .toggle-btn { display: none; font-size: 16px; padding: 2px 6px; line-height: 1; }
  @media (max-width: 1023px) {
    .toggle-btn { display: inline-block; }
  }

  /* ── Layout ───────────────────────────────────────────────────── */
  #editor-layout { display: flex; flex: 1; overflow: hidden; position: relative; }

  /* Palette — fixed sidebar at ≥1024px, overlay below */
  #palette {
    width: 180px; flex-shrink: 0; border-right: 2px solid var(--border);
    overflow-y: auto; padding: 8px; background: var(--bg);
    z-index: 50; transition: transform 0.2s ease;
  }
  #palette h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin: 8px 0 4px; color: var(--ink-dim); }
  #palette .node-item {
    display: block; width: 100%; text-align: left; padding: 5px 8px;
    margin-bottom: 2px; cursor: grab; font-size: 12px; border-radius: 3px;
    border: 1px solid var(--border); background: var(--surface);
    -webkit-user-select: none; user-select: none;
  }
  @media (max-width: 1023px) {
    #palette {
      position: fixed; left: 0; top: 48px; bottom: 0; width: 200px;
      transform: translateX(-100%);
    }
    #palette.open { transform: translateX(0); }
  }

  /* Palette bookmark button — always visible in corner */
  .palette-bookmark {
    position: absolute; top: 6px; left: 6px; z-index: 45;
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--surface); border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 14px; line-height: 1;
  }
  @media (min-width: 1024px) {
    .palette-bookmark { display: none; }
  }

  #canvas-wrap { flex: 1; position: relative; }
  #graph-canvas { width: 100%; height: 100%; touch-action: none; }

  /* Inspector — fixed sidebar at ≥1024px, drawer below */
  #inspector {
    width: 260px; flex-shrink: 0; border-left: 2px solid var(--border);
    overflow-y: auto; padding: 12px; font-size: 13px; background: var(--bg);
    z-index: 50; transition: transform 0.2s ease;
  }
  #inspector h3 { font-size: 13px; margin: 0 0 8px; }
  #inspector label { display: block; margin: 8px 0 2px; font-size: 11px; color: var(--ink-dim); }
  #inspector input, #inspector select {
    width: 100%; font-family: inherit; font-size: 13px;
    background: var(--surface); color: var(--ink); border: 2px solid var(--border);
    border-radius: 3px; padding: 3px 6px; box-sizing: border-box;
  }
  #inspector input[type="range"] { border: none; padding: 0; }
  #inspector .param-readout { font-size: 11px; color: var(--ink-dim); float: right; }
  @media (max-width: 1023px) {
    #inspector {
      position: fixed; right: 0; top: 48px; bottom: 0; width: 260px;
      transform: translateX(100%);
    }
    #inspector.open { transform: translateX(0); }
  }

  /* ── Card browser (<768px) ───────────────────────────────────── */
  #card-browser { display: none; flex: 1; overflow-y: auto; padding: 12px; }
  @media (max-width: 767px) {
    #editor-layout { display: none; }
    #card-browser { display: block; }
  }
  .preset-card {
    border: 2px solid var(--border); border-radius: 6px; padding: 12px;
    margin-bottom: 8px; background: var(--surface);
    display: flex; align-items: center; gap: 10px;
  }
  .preset-card.active { border-color: var(--accent); }
  .preset-card .card-info { flex: 1; min-width: 0; }
  .preset-card .card-name { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .preset-card .card-desc { font-size: 12px; color: var(--ink-dim); margin: 0; }
  .preset-card .card-badge { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: var(--border); display: inline-block; margin-top: 3px; }
  .preset-card .card-live { color: var(--accent); font-size: 11px; font-weight: 600; }
  .preset-card button {
    font-family: inherit; font-size: 12px; padding: 4px 10px;
    border-radius: 4px; cursor: pointer; flex-shrink: 0;
    background: var(--surface); color: var(--ink); border: 2px solid var(--border);
  }
  .preset-card button.tweak-btn { font-size: 16px; padding: 2px 6px; line-height: 1; }
  #btn-new-preset {
    display: block; width: 100%; margin-bottom: 12px; padding: 10px;
    font-family: inherit; font-size: 14px; cursor: pointer;
    background: var(--surface); color: var(--accent); border: 2px dashed var(--accent);
    border-radius: 6px;
  }

  /* ── Tweak panel (bottom sheet, <768px) ───────────────────────── */
  #tweak-overlay { display: none; }
  @media (max-width: 767px) {
    #tweak-overlay { display: block; }
  }
  #tweak-overlay {
    position: fixed; inset: 0; z-index: 55; background: rgba(0,0,0,0.4);
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  #tweak-overlay.open { opacity: 1; pointer-events: auto; }
  .tweak-panel {
    position: fixed; bottom: 0; left: 0; right: 0;
    max-height: 60vh; z-index: 60;
    background: var(--surface); border-top: 2px solid var(--border);
    border-radius: 12px 12px 0 0; padding: 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px) + 48px);
    transform: translateY(100%); transition: transform 0.25s ease;
    overflow-y: auto;
  }
  .tweak-panel.open { transform: translateY(0); }
  .tweak-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 12px; cursor: grab; }
  .tweak-panel h3 { margin: 0 0 12px; font-size: 15px; }
  .tweak-panel label { display: block; font-size: 12px; color: var(--ink-dim); margin: 10px 0 2px; }
  .tweak-panel input[type="range"] { width: 100%; }
  .tweak-panel .tweak-readout { font-size: 11px; color: var(--ink-dim); text-align: right; }
  #tweak-close {
    display: block; width: 100%; margin-top: 12px; padding: 10px;
    font-family: inherit; font-size: 14px; cursor: pointer;
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
  }

  /* ── Node category colours ────────────────────────────────────── */
  .cat-source { border-left: 3px solid #4488cc; }
  .cat-analysis { border-left: 3px solid #44aa66; }
  .cat-routing { border-left: 3px solid #ccaa44; }
  .cat-effect { border-left: 3px solid #cc4444; }
  .cat-modulation { border-left: 3px solid #8844cc; }
  .cat-output_effect { border-left: 3px solid #cc4488; }

  #status-bar { padding: 2px 12px; font-size: 11px; color: var(--ink-dim); border-top: 1px solid var(--border); flex-shrink: 0; }
</style>
</head>
<body>
<huemux-header active="presets"></huemux-header>
<div id="app">
  <div id="toolbar">
    <select id="preset-select"><option value="">-- Load --</option></select>
    <button id="btn-new">New</button>
    <button id="btn-save" class="primary">Save</button>
    <button id="btn-activate">Activate</button>
    <button id="btn-deactivate">Deactivate</button>
    <span class="sep"></span>
    <button id="btn-palette" class="toggle-btn" title="Palette">&#x1F4D1;</button>
    <button id="btn-inspector" class="toggle-btn" title="Inspector">&#x2699;</button>
    <span id="conn-dot" class="dot" title="connection to HueMux"></span>
    <span id="live-badge" class="live-badge" hidden>● LIVE</span>
  </div>
  <div id="editor-layout">
    <div id="palette"><h3>Loading catalog…</h3></div>
    <div id="canvas-wrap">
      <button class="palette-bookmark" id="palette-bookmark" title="Palette">&#x1F4D1;</button>
      <canvas id="graph-canvas"></canvas>
    </div>
    <div id="inspector"><p style="color:var(--ink-dim);font-size:12px">Select a node to inspect.</p></div>
  </div>
  <div id="card-browser">
    <button id="btn-new-preset">+ New Preset</button>
    <div id="preset-cards"></div>
  </div>
  <div id="status-bar">Not connected</div>
</div>
<div id="tweak-overlay"></div>
<div class="tweak-panel" id="tweak-panel" hidden>
  <div class="tweak-handle" id="tweak-handle"></div>
  <h3 id="tweak-title"></h3>
  <div id="tweak-controls"></div>
  <button id="tweak-close">Done</button>
</div>

<script src="/shared/theme.js"></script>
<script src="/shared/scrollbars.js"></script>
<script src="/shared/slider-touch.js"></script>
<script src="/shared/i18n.js"></script>
<script src="/shared/features.js"></script>
<script src="/shared/header.js"></script>
<script src="/shared/pairing.js"></script>
<script>HueMuxI18n.init(); HueMuxFeatures.load();</script>
<script src="/shared/auth.js"></script>
<script src="/vendor/litegraph.js"></script>
<script src="/node-editor.js"></script>
</body>
</html>
