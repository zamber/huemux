<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>lightsync</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>lightsync</h1>
  <span id="conn-dot" class="dot" title="connection to lightsync"></span>
</header>

<main>
  <section id="area-panel">
    <label for="area-select">Entertainment area</label>
    <select id="area-select"><option value="">Loading areas…</option></select>
    <button id="start-btn" disabled>Start sync</button>
    <button id="stop-btn" disabled>Stop</button>
    <button id="change-source-btn" disabled>Change source</button>
    <p id="area-warning" class="warning" hidden></p>
  </section>

  <section id="preview-panel">
    <canvas id="preview" width="640" height="360"></canvas>
    <p class="hint">Click a rect to blink that light. Zones update live once syncing.</p>
    <button id="flip-depth-btn" disabled>Flip depth axis</button>
  </section>

  <section id="status-panel">
    <div class="status-grid" id="status-grid"></div>
  </section>

  <section id="controls-panel">
    <h2>Primary</h2>

    <div class="control">
      <label>Reactivity</label>
      <div class="presets">
        <button data-preset-reactivity="20">Subtle</button>
        <button data-preset-reactivity="45">Moderate</button>
        <button data-preset-reactivity="70">High</button>
        <button data-preset-reactivity="90">Intense</button>
      </div>
      <input type="range" min="0" max="100" step="1" data-setting="reactivity" data-type="float">
    </div>

    <div class="control">
      <label>Brightness (<span data-readout="brightness"></span>%)</label>
      <input type="range" min="0" max="200" step="1" data-setting="brightness" data-type="float" data-readout-target="brightness">
    </div>

    <div class="control">
      <label>Saturation (<span data-readout="saturation"></span>%)</label>
      <input type="range" min="0" max="200" step="1" data-setting="saturation" data-type="float" data-readout-target="saturation">
    </div>

    <h2>Sampling</h2>

    <div class="control">
      <label>Mode</label>
      <select data-setting="mode" data-type="string">
        <option value="edges">edges</option>
        <option value="quadrant">quadrant</option>
        <option value="global">global</option>
        <option value="spread">spread</option>
      </select>
    </div>

    <div class="control">
      <label>Edge width</label>
      <input type="range" min="0.02" max="0.4" step="0.01" data-setting="edge_width" data-type="float">
    </div>

    <div class="control checkbox">
      <label><input type="checkbox" data-setting="invert_depth" data-type="bool"> Invert depth axis</label>
    </div>

    <div class="control checkbox">
      <label><input type="checkbox" data-setting="letterbox" data-type="bool"> Ignore black bars</label>
    </div>

    <h2>Output shaping</h2>

    <div class="control">
      <label>Black cutoff</label>
      <input type="range" min="0" max="0.2" step="0.005" data-setting="black_cutoff" data-type="float">
    </div>

    <div class="control">
      <label>Scene-cut sensitivity</label>
      <input type="range" min="0.05" max="1" step="0.01" data-setting="scene_cut_sensitivity" data-type="float">
    </div>

    <details>
      <summary>Advanced</summary>

      <div class="control">
        <label>Capture width</label>
        <input type="number" min="80" max="640" step="1" data-setting="capture_width" data-type="int">
      </div>
      <div class="control">
        <label>Capture height</label>
        <input type="number" min="45" max="360" step="1" data-setting="capture_height" data-type="int">
      </div>
      <div class="control">
        <label>Capture FPS</label>
        <input type="number" min="5" max="60" step="1" data-setting="capture_fps" data-type="int">
      </div>
      <div class="control">
        <label>Output Hz</label>
        <input type="number" min="5" max="25" step="1" data-setting="output_hz" data-type="int">
      </div>
      <div class="control">
        <label>Color space</label>
        <select data-setting="color_space" data-type="string">
          <option value="rgb">RGB</option>
          <option value="xy">xy + brightness</option>
        </select>
      </div>
      <div class="control checkbox">
        <label><input type="checkbox" data-setting="disable_ems" data-type="bool"> Disable extended master secret</label>
      </div>
    </details>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
