<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#000000" id="theme-color-meta">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>HueMux</title>
<script>
(function() {
  var DARK = '#000000', LIGHT = '#f7f3ea';
  var t = localStorage.getItem('theme');
  var resolved;
  // Palette and decoration are two independent keys; read both, or a page
  // stored as dark+simple flashes the wrong one before theme.js corrects it.
  // Still understands the old combined values, which are migrated on the
  // first run of theme.js but are whatever is on disk until then.
  // Keep in sync with PALETTES/SIMPLE_KEY in shared/theme.js.
  var base = { light: 'light', dark: 'dark', 'simple-light': 'light', 'simple-dark': 'dark' }[t];
  if (base) {
    document.documentElement.setAttribute('data-theme', base);
    resolved = base;
  } else {
    resolved = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  if (localStorage.getItem('themeSimple') === '1' || (t && t.indexOf('simple-') === 0)) {
    document.documentElement.setAttribute('data-simple', '');
  }
  var meta = document.getElementById('theme-color-meta');
  if (meta) meta.setAttribute('content', resolved === 'light' ? LIGHT : DARK);
})();
</script>
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/shared/header.css">
<link rel="stylesheet" href="/shared/scrollbars.css">
<link rel="stylesheet" href="/shared/shell.css">
</head>
<body>
<huemux-header active="sync"></huemux-header>
<!-- Iframes are created by the bootstrap below, not written statically:
     each one opens its own WebSocket the moment it loads, so a frame for a
     tab the profile disabled would be a second connection to a page nobody
     can reach. -->
<div class="shell-frames" id="shell-frames"></div>

<script src="/shared/theme.js"></script>
<script src="/shared/scrollbars.js"></script>
<script src="/shared/slider-touch.js"></script>
<script src="/shared/i18n.js"></script>
<script src="/shared/features.js"></script>
<script src="/shared/header.js"></script>
<script>
  // Order matters twice over.
  //
  // Features must resolve before the iframes are created, so a disabled tab
  // never loads a page (and opens a WebSocket) that is then hidden.
  //
  // And shell.js needs the i18n dictionary already loaded the first time it
  // sets document.title — unlike data-i18n DOM text, which init()'s own
  // concluding applyTo(document) sweep re-corrects a moment later, a title
  // set once from a still-empty dictionary would just stick as a raw key.
  Promise.all([HueMuxI18n.init(), HueMuxFeatures.load()]).then(function (r) {
    var f = r[1];
    var host = document.getElementById('shell-frames');

    function addFrame(id, src, title) {
      var el = document.createElement('iframe');
      el.id = id;
      el.className = 'shell-frame';
      el.src = src;
      el.title = title;
      host.appendChild(el);
    }
    if (f.sync) addFrame('frame-sync', '/sync.html', 'Sync');
    if (f.lights) addFrame('frame-lights', '/lights.html', 'Lights');
    // Settings is not profile-gated — it is how you change the profile, and
    // on a phone it is the only route to a diagnostics report. It is a frame
    // rather than a link for the same reason the other two are: leaving the
    // shell destroys every iframe in it, so a trip to Settings used to end
    // with lights.html loaded standalone and every subsequent tab switch a
    // full page load, refetching and re-rendering from empty.
    addFrame('frame-settings', '/settings.html', 'Settings');

    var s = document.createElement('script');
    s.src = '/shared/shell.js';
    document.body.appendChild(s);
  });
</script>
</body>
</html>
