<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#000000" id="theme-color-meta">
<title>lightsync</title>
<script>
(function() {
  var DARK = '#000000', LIGHT = '#f7f3ea';
  var t = localStorage.getItem('theme');
  var resolved;
  if (t === 'light' || t === 'dark') {
    document.documentElement.setAttribute('data-theme', t);
    resolved = t;
  } else {
    resolved = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  var meta = document.getElementById('theme-color-meta');
  if (meta) meta.setAttribute('content', resolved === 'light' ? LIGHT : DARK);
})();
</script>
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/shared/header.css">
<link rel="stylesheet" href="/shared/shell.css">
</head>
<body>
<lightsync-header active="sync"></lightsync-header>
<div class="shell-frames">
  <iframe id="frame-sync" class="shell-frame active" src="/sync.html" title="Sync"></iframe>
  <iframe id="frame-lights" class="shell-frame" src="/lights.html" title="Lights"></iframe>
</div>

<script src="/shared/theme.js"></script>
<script src="/shared/i18n.js"></script>
<script src="/shared/header.js"></script>
<script>
  // shell.js needs the i18n dictionary already loaded the first time it
  // sets document.title — unlike data-i18n DOM text, which init()'s own
  // concluding applyTo(document) sweep re-corrects a moment later, a title
  // set once from a still-empty dictionary would just stick as a raw key.
  LightsyncI18n.init().then(function () {
    var s = document.createElement('script');
    s.src = '/shared/shell.js';
    document.body.appendChild(s);
  });
</script>
</body>
</html>
