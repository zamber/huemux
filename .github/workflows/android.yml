name: Android

# Builds the gomobile AAR — the Go core packaged as an Android library.
#
# This lives in CI rather than being buildable locally on purpose: the Android
# SDK plus NDK is roughly 8-12 GB, which is more than the development host has
# free, and gomobile bind needs CGO and the NDK toolchain (unlike the rest of
# this project, which is CGO_ENABLED=0 and cross-compiles anywhere). GitHub's
# Ubuntu runners ship both preinstalled, so there is nothing to provision here.
#
# What CAN be checked without any of that, and is checked in the `verify` job
# below, is that every package still compiles for android/arm64 — Go can do
# that with CGO_ENABLED=0 and no NDK at all. That is the check worth running on
# every push, since it catches the realistic regression (someone pulls in a
# dependency that is not pure Go) in seconds rather than minutes.
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'internal/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast gate: does the whole core still target Android at all?
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Needs the Go toolchain: the file is generated from `go list -deps`,
      # i.e. the modules the linker actually pulls in.
      - name: Third-party licences are current
        run: scripts/gen-third-party-licenses.sh --check

      # Translations are machine-produced, so the failures worth guarding are
      # the mechanical ones: a missing key renders as a raw key path, a mangled
      # {placeholder} is a substitution that silently never happens, and a bidi
      # control character is invisible in an editor while corrupting layout.
      - name: Translations are structurally sound
        run: scripts/check-i18n.py

      - name: Cross-compile for android/arm64
        run: |
          # No NDK needed for this — it only proves the Go side has no
          # platform-specific blocker, which is the thing most likely to break.
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build ./...

      - name: Test the mobile facade
        run: go test ./mobile/... -count=1

  # The real artifact. Slower, and only worth running on main or on demand.
  aar:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      # Deliberately NOT go-version-file: go.mod here, unlike the verify job.
      # gomobile tracks recent Go closely and currently requires >= 1.25, while
      # this module declares 1.24 so it still builds on the development host.
      # setup-go pins GOTOOLCHAIN=local, so taking the version from go.mod made
      # `go install gomobile@latest` fail outright. A newer toolchain builds an
      # older `go` directive fine, so only the AAR job needs the bump — the
      # verify job keeps using go.mod precisely because it should test what the
      # project actually claims to support.
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Initialise gomobile against the runner's NDK
        run: gomobile init

      # gomobile bind now insists golang.org/x/mobile is in the module's own
      # dependency graph. Added here rather than committed to go.mod because
      # x/mobile requires Go >= 1.25 while this module targets 1.24 so it keeps
      # building on the development host — committing it would force every
      # contributor onto a newer toolchain for a dependency only the AAR needs.
      # The runner's checkout is throwaway, so this never leaves CI.
      - name: Add the gomobile tool dependency (CI-only, not committed)
        run: |
          go get -tool golang.org/x/mobile/cmd/gobind
          git --no-pager diff --stat go.mod || true

      - name: Build AAR
        run: |
          mkdir -p dist
          # arm64-v8a only for now: it covers every current Android device, and
          # a universal build would multiply the ~10MB Go runtime by four for
          # architectures nobody is going to install this on. Revisit if a real
          # 32-bit or x86 user turns up.
          gomobile bind -target=android/arm64 \
            -androidapi 26 \
            -javapkg com.huemux \
            -o dist/huemux.aar \
            ./mobile

      - name: Report size
        run: ls -lh dist/huemux.aar

      - uses: actions/upload-artifact@v7
        with:
          name: huemux-aar
          path: dist/huemux.aar
          if-no-files-found: error

      # Gradle picks the AAR up from app/libs/ — see android/app/build.gradle.kts.
      # It is not committed: a 6MB build artifact containing the whole Go
      # runtime does not belong in git.
      - name: Stage the AAR for Gradle
        run: cp dist/huemux.aar android/app/libs/huemux.aar

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: android
        run: |
          # No Gradle wrapper is committed — a wrapper jar is a binary blob and
          # the runner already has Gradle. `gradle wrapper` first so the build
          # still uses a pinned Gradle version rather than whatever ships today.
          gradle wrapper --gradle-version 8.11.1
          ./gradlew --no-daemon assembleDebug

      - name: Report APK size
        run: ls -lh android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: huemux-apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
