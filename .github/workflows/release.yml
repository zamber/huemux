name: Release

# Triggered by pushing a tag like v1.0.0 (git tag v1.0.0 && git push origin v1.0.0).
# Builds both binaries (huemux, huemux-desktop) for every supported platform
# from a single Linux runner — CGO_ENABLED=0 and pure-Go dependencies
# (pion/dtls, go-astilectron) make that cross-compilation actually work,
# no per-OS runner matrix needed. Frontend is plain HTML/CSS/JS embedded via
# go:embed, so there's no separate JS build step either.
#
# A tag containing a hyphen (v0.1.0-alpha.1, v1.0.0-rc.2) is published as a
# GitHub pre-release, per the semver convention that everything after the
# hyphen is a pre-release identifier.
on:
  push:
    tags:
      - 'v*'

# Read-only by default; only the job that creates the release gets write. The
# build and sign jobs handle artifacts and a signing key, and neither has any
# business being able to alter the repository.
permissions:
  contents: read

jobs:
  # The Android APK, built in its own job because it needs a different Go
  # toolchain (gomobile requires >= 1.25 while this module targets 1.24), the
  # NDK, and a JDK. Attached to the release rather than left as an Actions
  # artifact, since those expire and require a GitHub login to download.
  android:
    runs-on: ubuntu-latest
    # The keystore secrets live in this environment rather than at repository
    # scope, so only a job that names it can read them. android.yml has a
    # pull_request trigger, and a branch PR in this repo would otherwise have
    # been able to read the app signing key.
    environment: signing
    steps:
      # Full history: versionCode is the commit count, and checkout's default
      # shallow clone would make that 1 on every build — which is exactly the
      # hardcoded value this replaced.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # A release keystore, if one has been configured. Without it the job
      # still produces a debug-signed APK — installable, just not upgradeable
      # from a differently-signed build and not eligible for a store. Making
      # this optional keeps the repo buildable by anyone who forks it.
      # The emptiness check is inside the script rather than in `if:`. A step's
      # own `env:` block is not reliably in scope for its own `if:` expression,
      # and the failure mode is silent in the worst direction: the step is
      # skipped even though the secret is set, no keystore path is produced,
      # and the build quietly falls back to a debug-signed APK that no store
      # will take and no installed copy can upgrade from.
      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::No ANDROID_KEYSTORE_B64 secret — this build will be debug-signed"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/huemux.jks"
          echo "path=$RUNNER_TEMP/huemux.jks" >> "$GITHUB_OUTPUT"

      # versionName is the tag; versionCode is the commit count — monotonic,
      # and derived from the source rather than from the CI run, so rebuilding
      # a tag reproduces the same number.
      - name: Derive Android version
        id: version
        run: |
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          HUEMUX_KEYSTORE: ${{ steps.keystore.outputs.path }}
          HUEMUX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HUEMUX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HUEMUX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          HUEMUX_VERSION_NAME: ${{ steps.version.outputs.name }}
          HUEMUX_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          gomobile init
          go get -tool golang.org/x/mobile/cmd/gobind
          mkdir -p android/app/libs
          gomobile bind -target=android/arm64 -androidapi 26 \
            -javapkg com.huemux -o android/app/libs/huemux.aar ./mobile
          cd android
          gradle wrapper --gradle-version 8.11.1
          mkdir -p ../apk
          if [ -n "$HUEMUX_KEYSTORE" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk \
               "../apk/huemux-${GITHUB_REF_NAME}-arm64.apk"
          else
            echo "::notice::No ANDROID_KEYSTORE_B64 secret — producing a debug-signed APK"
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk \
               "../apk/huemux-${GITHUB_REF_NAME}-arm64-debug.apk"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: apk/*.apk
          if-no-files-found: error

  # No secrets, deliberately. Everything reproducible from the source alone
  # happens here, so the jobs that do hold credentials stay as small as
  # possible and a failure in one of them never means rebuilding.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Cheap relative to the build, and the alternative is discovering a
      # broken release after the artifacts are already published.
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      # Attribution is a licence condition, not a nicety — MIT, BSD and
      # Apache-2.0 all require it. This fails if a dependency was added without
      # regenerating the file, or if one arrives under a licence that is not
      # compatible with GPL-3.0-or-later.
      - name: Third-party licences are current
        run: scripts/gen-third-party-licenses.sh --check

      # Translations are machine-produced, so the failures worth guarding are
      # the mechanical ones: a missing key renders as a raw key path, a mangled
      # {placeholder} is a substitution that silently never happens, and a bidi
      # control character is invisible in an editor while corrupting layout.
      - name: Translations are structurally sound
        run: scripts/check-i18n.py

      - name: Build all platform binaries
        run: |
          make dist
          make dist-desktop

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  # Holds the GPG key, and nothing else. Separate from publish because a job
  # may declare only one environment, and publish needs a different one to
  # carry the approval gate — so signing and gating cannot share a job.
  sign:
    runs-on: ubuntu-latest
    needs: [build, android]
    environment: signing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: dist

      # make dist wrote SHA256SUMS before the APK existed, so it would ship
      # unhashed while every other asset is verifiable. Append rather than
      # regenerate: the Makefile's own globs would double-count the desktop
      # binaries if re-run here.
      - name: Add the APK to SHA256SUMS
        run: cd dist && sha256sum *.apk >> SHA256SUMS && cat SHA256SUMS

      # Sign the checksum file rather than every artifact: one signature covers
      # all of them, since SHA256SUMS already binds each file's content. A
      # detached .asc alongside it is the convention every Linux packager and
      # every wary user already knows how to check.
      - name: Sign SHA256SUMS
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::notice::No GPG_PRIVATE_KEY secret — release will be unsigned"
            exit 0
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/pw"
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/pw" \
              --armor --detach-sign --output dist/SHA256SUMS.asc dist/SHA256SUMS
          shred -u "$RUNNER_TEMP/pw"
          # Prove the signature verifies here, so a broken one is caught now
          # rather than by the first person who bothers to check it.
          gpg --verify dist/SHA256SUMS.asc dist/SHA256SUMS
          cp RELEASE-SIGNING-KEY.asc dist/

      # --- Windows and macOS signing --------------------------------------
      #
      # Gated on secrets that do not exist yet and cannot be created without
      # buying something: Authenticode needs a CA-issued certificate, and a
      # Developer ID certificate is issued by Apple to paying members only.
      # Self-signed is not a cheaper version of either — it satisfies neither
      # SmartScreen nor Gatekeeper. See PUBLISHING.md.
      - name: Sign Windows binaries
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ]; then
            echo "::notice::No Windows signing certificate configured — .exe files are unsigned"
            exit 0
          fi
          echo "::error::Windows signing secrets are set but the signing step is not implemented yet"
          exit 1

      - name: Notarize macOS binaries
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -z "$APPLE_API_KEY_ID" ]; then
            echo "::notice::No Apple Developer credentials configured — macOS builds are unsigned"
            exit 0
          fi
          echo "::error::Apple signing secrets are set but the notarization step is not implemented yet"
          exit 1

      - uses: actions/upload-artifact@v7
        with:
          name: signed
          path: dist/*
          if-no-files-found: error

  # Holds no signing key — only the token that creates the release. The
  # environment it names is chosen by the tag:
  #
  #   v0.1.0-alpha.3  ->  release-prerelease, unattended
  #   v0.1.0          ->  release-stable, waits for a human
  #
  # Alphas are the development loop here and must not need an approval each
  # time; a stable release goes to people who did not ask to be testers, so it
  # pauses. Two environments rather than one because a required reviewer is a
  # property of the environment, not something a condition can switch on.
  publish:
    runs-on: ubuntu-latest
    needs: sign
    permissions:
      contents: write
    environment: >-
      ${{ contains(github.ref_name, '-') && 'release-prerelease' || 'release-stable' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: signed
          path: dist

      # A curated .github/release-notes/<tag>.md is used as the release body
      # when one exists; otherwise the body is left to the auto-generated
      # commit list. Keeps a hand-written release from needing a manual edit
      # after every publish.
      - name: Locate curated release notes
        id: notes
        run: |
          f=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then
            echo "using curated notes: $f"
            echo "path=$f" >> "$GITHUB_OUTPUT"
          else
            echo "no curated notes at $f — falling back to generated notes"
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
